# Trunk build configuration for shadcn-rs showcase

[build]
# Output directory for built files
dist = "dist"
# Public URL base path (update for GitHub Pages if needed)
# For GitHub Pages: public_url = "/shadcn-rs/"
public_url = "/"

[watch]
# Files/directories to watch for changes
watch = ["src", "index.html", "showcase.css", "../shadcn-rs/src", "../shadcn-rs/styles", "../shadcn-icons/src"]
# Files to ignore
ignore = ["dist", "dist-release"]

[serve]
# Development server configuration
addresses = ["127.0.0.1"]
port = 8180
open = false

# Trunk manages staging and replaces its output directory after successful builds.
# Avoid a custom cleanup hook: it races with other builds and ignores --dist.
